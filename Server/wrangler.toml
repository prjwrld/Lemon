# Lemon's licence key server for Razorpay (India) purchases. See README.md.
name = "lemon-licences"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# Lemon's price on your Razorpay Payment Page, in paise (₹799 = 79900). Only payments of
# exactly this amount in INR create a key, so other sales on your account don't.
PRICE_PAISE = "79900"
# The form fields on Lemon's Razorpay Payment Page. Razorpay copies them into the payment's notes; a payment
# with any other note (from Secret Santa, Rightly…) never makes a Lemon key. Add a field here if you add one
# to the page.
PAGE_NOTE_KEYS = "email,phone"
# How many Macs one key can be active on at once.
ACTIVATION_LIMIT = "2"
# Shown in emails and on the Find My Key page.
SUPPORT_EMAIL = "support@fixbyai.in"
# Sender for key emails (a domain you've verified in Resend). Only used if RESEND_API_KEY is set.
EMAIL_FROM = "Lemon <keys@example.com>"

# Secrets (set with `npx wrangler secret put NAME`, never written here):
#   RAZORPAY_WEBHOOK_SECRET  the secret you type when adding the webhook in Razorpay
#   ADMIN_TOKEN              a long random password for /admin/keys
#   RESEND_API_KEY           optional: emails each buyer their key

[[d1_databases]]
binding = "DB"
database_name = "lemon-licences"
database_id = "c1f4e5f4-3077-4626-aac8-969a4ef67508"
